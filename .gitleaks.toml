# gitleaks configuration for robinhood-agent-trading-cli.
#
# This tool hardcodes no secrets. The OAuth access/refresh token bundle exists
# only in the OS keychain at runtime; the dynamically-registered OAuth client id
# is a public identifier, not a secret. Test fixtures are synthetic and carry no
# real values (see tests/fixtures/README.md). So we extend the default ruleset
# with no allowlisted secrets. If gitleaks flags something, it's a real finding:
# remove it, don't allowlist it.

[extend]
useDefault = true
