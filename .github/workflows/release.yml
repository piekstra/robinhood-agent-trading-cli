name: release

# Cut a release by pushing a tag like `v0.1.0`. One Linux job and ONE macOS
# job (Apple Silicon, which cross-compiles the Intel target — the macOS SDK is
# universal). Jobs are independent (fail-fast: false) and each attaches its own
# assets, so a slow or dead macOS queue can never block the Linux assets and
# only one macOS runner is ever needed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: apple (aarch64 + x86_64)
            targets: "aarch64-apple-darwin x86_64-apple-darwin"
          - os: ubuntu-latest
            name: linux x86_64
            targets: "x86_64-unknown-linux-gnu"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        # Pinned by SHA, so the toolchain cannot come from the ref name.
        with:
          toolchain: stable
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build and package each target
        run: |
          for t in ${{ matrix.targets }}; do
            rustup target add "$t"
            cargo build --release --target "$t"
            tar -C "target/$t/release" -czf "rhap-$t.tar.gz" rhap
            shasum -a 256 "rhap-$t.tar.gz" > "rhap-$t.tar.gz.sha256"
          done
      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            rhap-*.tar.gz
            rhap-*.tar.gz.sha256
